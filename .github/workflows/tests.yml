name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Run tests with pytest
      run: |
        pytest --cov=src --cov-report=xml --cov-report=term -v

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      continue-on-error: true
      with:
        # Codecov refuses tokenless uploads from this repository's own
        # branches; the token is a repository secret (empty until it is
        # created, and on Dependabot pull requests, which get no secrets).
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  lint:
    name: Lint with flake8
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8

    - name: Lint - syntax errors and undefined names (blocking)
      run: |
        flake8 src --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Lint - style warnings (non-blocking)
      run: |
        flake8 src --count --exit-zero --max-complexity=20 --max-line-length=120 --statistics

  type-check:
    name: Type check with mypy
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    # Blocking, but only for NEW errors. Pre-existing ones are frozen in
    # tools/mypy_baseline.txt; the script fails the job when an error appears
    # beyond that baseline. mypy settings live in [tool.mypy] in pyproject.toml
    # rather than on this command line, so a bare `mypy src` locally and this
    # job check exactly the same things.
    #
    # This job is not decorative: the suite mocks `ctx` with AsyncMock
    # everywhere, so regressions in how the server talks to the MCP client
    # can pass every test while mypy is the only thing that notices.
    - name: Type check with mypy (new errors are blocking)
      run: |
        python tools/check_mypy_baseline.py

  format-check:
    name: Check formatting with Black
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install Black
      run: |
        python -m pip install --upgrade pip
        pip install black

    # Blocking. It was `continue-on-error: true` from the start, so it sat
    # green over a tree where 70 of 91 files would have been reformatted --
    # the same decorative-check defect removed from the mypy job above.
    #
    # line-length comes from [tool.black] in pyproject.toml rather than this
    # command line, so a bare `black src tests benchmarks tools` locally and
    # this job agree. `benchmarks` is in scope so the CWRU benchmark package is
    # format-gated like src and tests (asserted by
    # tests/test_cwru_benchmark_guards.py); `tools` covers the audit CLI and
    # the mypy baseline script.
    - name: Check code formatting
      run: |
        black --check src tests benchmarks tools

  package-smoke:
    name: Installed-package smoke (wheel, Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install build
      run: |
        python -m pip install build

    - name: Build the sdist and the wheel
      run: |
        python -m build

    # Blocking. Reads the built wheel and sdist themselves: MIT license
    # metadata, the MIT LICENSE as their only license file, and no file from
    # data/ or copy of the third-party sample data listed in
    # tools/audit/third_party_data.json.
    - name: Check the licensing of the built wheel and sdist
      run: |
        python -m tools.audit artifact-licensing --dist dist --variant pr-ubuntu-py3.11

    # Blocking. Every other job runs the checkout; this one installs the built
    # wheel into a fresh venv outside it and runs the stdio smoke harness
    # against the installed console script, which is what a user gets.
    - name: Install the wheel into a fresh venv and run the stdio smoke harness
      run: |
        python -m tools.audit package-smoke --dist dist --artifact wheel --variant pr-ubuntu-py3.11
